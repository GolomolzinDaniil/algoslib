<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algoslib</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="tabs">
        <button class="tab active" data-tab="sorting">
            <i data-lucide="arrow-up-down"></i>
            <span>Сортировки</span>
        </button>
        <button class="tab" data-tab="graphs">
            <i data-lucide="git-fork"></i>
            <span>Графы</span>
        </button>
    </nav>

    <section id="sorting" class="page active">

        <div class="sorting-header" id="sort-header" style="display:none">
            <div class="sorting-header-title" id="sort-title">Bubble Sort</div>
            <div class="sorting-header-desc" id="sort-desc">Описание...</div>
            <div class="sorting-header-time" id="sort-time">Время: O(n²)</div>
            <div class="sorting-header-memory" id="sort-memory">Память: O(1)</div>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <label>Алгоритм:</label>
                <select id="sort-algo">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                </select>
            </div>
            <div class="input-row">
                <label>Массив (через запятую, макс. 15):</label>
                <input type="text" id="sort-data" value="5, 3, 8, 1, 4, 2, 7, 6" placeholder="5, 3, 1, 4, 2">
            </div>
            <div class="input-row">
                <button class="btn primary" id="sort-run">
                    <i data-lucide="play"></i>
                    <span>Запустить</span>
                </button>
            </div>
        </div>

        <div class="viz-container">
            <div id="sort-plot" class="plot"></div>
        </div>

        <div class="controls" id="sort-controls" style="display:none">
            <button class="btn" id="sort-prev">
                <i data-lucide="skip-back"></i>
                <span>Назад</span>
            </button>
            <button class="btn primary" id="sort-play">
                <i data-lucide="play"></i>
                <span>Старт</span>
            </button>
            <button class="btn" id="sort-next">
                <span>Вперед</span>
                <i data-lucide="skip-forward"></i>
            </button>
            <div class="speed-control">
                <span>Скорость:</span>
                <input type="range" id="sort-speed" min="50" max="1000" value="300" step="50">
                <span id="sort-speed-val">300ms</span>
            </div>
        </div>
        <div id="sort-status" class="status"></div>
    </section>

    <section id="graphs" class="page">
        <div class="input-panel">
            <div class="input-row">
                <label>Алгоритм:</label>
                <select id="graph-algo">
                    <option value="bfs">BFS</option>
                    <option value="dijkstra">Dijkstra</option>
                </select>
            </div>
            <div class="input-row two-col">
                <div>
                    <label id="edges-label">Рёбра (по одному на строку: u v):</label>
                    <textarea id="graph-edges" rows="6" placeholder="0 1&#10;0 2&#10;1 3&#10;2 3">0 1
0 2
1 3
2 3
3 4</textarea>
                </div>
                <div>
                    <label>Начальная вершина:</label>
                    <input type="number" id="graph-start" value="0">
                </div>
            </div>
            <div class="input-row">
                <button class="btn primary" id="graph-run">
                    <i data-lucide="play"></i>
                    <span>Запустить</span>
                </button>
                <button class="btn" id="graph-example">
                    <i data-lucide="file-code"></i>
                    <span>Пример</span>
                </button>
            </div>
        </div>

        <div class="viz-container">
            <svg id="graph-svg" viewBox="0 0 600 400"></svg>
        </div>

        <div id="graph-info" class="step-info" style="display:none"></div>

        <div class="controls" id="graph-controls" style="display:none">
            <button class="btn" id="graph-prev">
                <i data-lucide="skip-back"></i>
                <span>Назад</span>
            </button>
            <button class="btn primary" id="graph-play">
                <i data-lucide="play"></i>
                <span>Старт</span>
            </button>
            <button class="btn" id="graph-next">
                <span>Вперед</span>
                <i data-lucide="skip-forward"></i>
            </button>
            <div class="speed-control">
                <span>Скорость:</span>
                <input type="range" id="graph-speed" min="100" max="2000" value="500" step="100">
                <span id="graph-speed-val">500ms</span>
            </div>
        </div>
        <div id="graph-status" class="status"></div>
    </section>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>lucide.createIcons();</script>
    <script type="module" src="/static/js/app.js"></script>
</body>

</html>
