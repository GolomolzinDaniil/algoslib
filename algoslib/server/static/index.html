<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algoslib</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="tabs">
        <button class="tab active" data-tab="sorting">
            <i data-lucide="arrow-up-down"></i>
            <span>Сортировки</span>
        </button>
        <button class="tab" data-tab="graphs">
            <i data-lucide="git-fork"></i>
            <span>Графы</span>
        </button>
        <button class="tab" data-tab="searches">
            <i data-lucide="search"></i>
            <span>Поиск</span>
        </button>
    </nav>

    <section id="sorting" class="page active">

        <div class="sorting-header" id="sort-header" style="display: block;">
            <div class="sorting-header-title" id="sort-title">Сортировки</div>
            <div class="sorting-header-desc" id="sort-desc">Выберите алгоритм сортировки и введите массив для
                визуализации</div>
            <div class="sorting-header-time" id="sort-time"></div>
            <div class="sorting-header-memory" id="sort-memory"></div>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <label>Алгоритм:</label>
                <select id="sort-algo">
                    <option value="" disabled selected>Выберите алгоритм</option>
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="gnome">Gnome Sort</option>
                    <option value="bogo">Bogo Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="counting">Counting Sort</option>
                </select>
            </div>
            <div class="input-row">
                <label>Массив (через запятую, макс. 15):</label>
                <input type="text" id="sort-data" value="5, 3, 8, 1, 4, 2, 7, 6" placeholder="5, 3, 1, 4, 2">
            </div>
            <div class="input-row file-upload-row">
                <label>TXT файл:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="sort-file" accept=".txt,text/plain">
                    <label class="file-input-action" for="sort-file">Выбрать файл</label>
                    <span class="file-input-name" id="sort-file-name">Файл не выбран</span>
                    <button type="button" id="sort-download-file" class="file-input-download"
                        aria-label="Скачать отсортированный .txt" title="Скачать отсортированный .txt">
                        <i data-lucide="square-arrow-down"></i>
                    </button>
                </div>
            </div>

        </div>

        <div class="viz-container">
            <div id="sort-plot" class="plot"></div>
        </div>

        <div class="controls" id="sort-controls" style="display:none">
            <button class="btn" id="sort-prev">
                <i data-lucide="skip-back"></i>
                <span>Назад</span>
            </button>
            <button class="btn primary" id="sort-play">
                <i data-lucide="play"></i>
                <span>Старт</span>
            </button>
            <button class="btn" id="sort-next">
                <span>Вперед</span>
                <i data-lucide="skip-forward"></i>
            </button>
            <div class="speed-control">
                <span>Скорость:</span>
                <input type="range" id="sort-speed" min="50" max="1000" value="300" step="50">
                <span id="sort-speed-val">300ms</span>
            </div>
        </div>
        <div id="sort-status" class="status"></div>
    </section>

    <section id="graphs" class="page">
        <div class="graph-main-row">
            <div class="input-panel">
                <div class="input-row">
                    <label>Алгоритм:</label>
                    <select id="graph-algo">
                        <option value="bfs">BFS</option>
                        <option value="dijkstra">Dijkstra</option>
                        <option value="bellman_ford">Bellman-Ford</option>
                        <option value="kruskal">Kruskal (MST)</option>
                        <option value="ford_fulkerson">Ford-Fulkerson (Макс. поток)</option>
                        <option value="edmonds_karp">Edmonds-Karp (BFS поток)</option>
                    </select>
                </div>
                <div class="input-row vertical">
                    <label id="edges-label">Рёбра (по одному на строку: u v):</label>
                    <textarea id="graph-edges" rows="6" placeholder="A B&#10;A C&#10;B D&#10;C D">A B
A C
B D
C D
D E</textarea>
                </div>
                <div class="input-row">
                    <label>Начальная вершина:</label>
                    <input type="text" id="graph-start" value="A" placeholder="A" maxlength="3">
                </div>
                <div id="sink-field" style="display: none;">
                    <label for="graph-sink">Сток (sink):</label>
                    <input type="text" id="graph-sink" value="F" placeholder="F" maxlength="3">
                </div>
                <div class="input-row">
                    <button class="btn primary" id="graph-run">
                        <i data-lucide="play"></i>
                        <span>Запустить</span>
                    </button>
                    <button class="btn" id="graph-example">
                        <i data-lucide="file-code"></i>
                        <span>Пример</span>
                    </button>
                </div>
                <div class="graph-spacing-control">
                    <span>Разреженность:</span>
                    <input type="range" id="graph-spacing" min="1" max="10" value="5" step="1">
                    <span id="graph-spacing-val">5</span>
                </div>
            </div>

            <div class="graph-right">
                <div class="viz-container">
                    <svg id="graph-svg" viewBox="0 0 600 400"></svg>
                </div>
            </div>
        </div>

        <div id="graph-info" class="step-info" style="display:none"></div>

        <div class="controls" id="graph-controls" style="display:none">
            <button class="btn" id="graph-prev">
                <i data-lucide="skip-back"></i>
                <span>Назад</span>
            </button>
            <button class="btn primary" id="graph-play">
                <i data-lucide="play"></i>
                <span>Старт</span>
            </button>
            <button class="btn" id="graph-next">
                <span>Вперед</span>
                <i data-lucide="skip-forward"></i>
            </button>
            <div class="speed-control">
                <span>Скорость:</span>
                <input type="range" id="graph-speed" min="100" max="2000" value="500" step="100">
                <span id="graph-speed-val">500ms</span>
            </div>
        </div>
        <div id="graph-status" class="status"></div>
    </section>

    <section id="searches" class="page">
        <div class="sorting-header" id="search-header" style="display: block;">
            <div class="sorting-header-title" id="search-title">Поиск</div>
            <div class="sorting-header-desc" id="search-desc">Выберите алгоритм поиска и введите данные</div>
            <div class="sorting-header-time" id="search-time"></div>
            <div class="sorting-header-memory" id="search-memory"></div>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <label>Алгоритм:</label>
                <select id="search-algo">
                    <option value="" disabled selected>Выберите алгоритм</option>
                    <option value="linear_searche">Linear Search</option>
                    <option value="linear_searche_both_sides">Bilinear Search</option>
                </select>
            </div>
            <div class="input-row">
                <label>Массив (через запятую):</label>
                <input type="text" id="search-data" value="5, 3, 8, 1, 4, 2, 7, 6" placeholder="5, 3, 1, 4, 2">
            </div>
            <div class="input-row">
                <label>Искомый элемент:</label>
                <input type="text" id="search-target" value="4" inputmode="decimal" placeholder="4">
            </div>
        </div>

        <div class="viz-container">
            <div id="search-plot" class="plot"></div>
        </div>
        <div class="search-array-toggle-wrap">
            <button
                type="button"
                class="btn search-array-toggle"
                id="search-array-toggle"
                style="display:none"
                aria-label="Развернуть массив"
                title="Развернуть массив"
            >
                <i data-lucide="chevron-down"></i>
            </button>
        </div>
        <div id="search-result-indexes" class="search-result-indexes"></div>

        <div class="controls" id="search-controls" style="display:none">
            <button class="btn" id="search-prev">
                <i data-lucide="skip-back"></i>
                <span>Назад</span>
            </button>
            <button class="btn primary" id="search-play">
                <i data-lucide="play"></i>
                <span>Старт</span>
            </button>
            <button class="btn" id="search-next">
                <span>Вперед</span>
                <i data-lucide="skip-forward"></i>
            </button>
            <div class="speed-control">
                <span>Скорость:</span>
                <input type="range" id="search-speed" min="50" max="1000" value="300" step="50">
                <span id="search-speed-val">300ms</span>
            </div>
        </div>
        <div id="search-status" class="status"></div>
    </section>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>lucide.createIcons();</script>
    <script type="module" src="/static/js/app.js"></script>
</body>

</html>
